name: Deploy preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare preview assets
        run: |
          mkdir -p preview/assets
          cp index.html preview/index.html
          cp -R assets/css preview/assets/css
          cp -R assets/js preview/assets/js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
